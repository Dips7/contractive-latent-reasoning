[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contractive-latent-reasoning"
version = "0.1.0"
description = "Contractive Continuous Latent Dynamical Systems for Foundation Model Reasoning"
authors = [
    { name = "Research Team" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchdiffeq>=0.2.3",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "tqdm>=4.65.0",
    "wandb>=0.16.0",
    "matplotlib>=3.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "jupyter>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
