seed: 42
device: "cuda" # or "cpu", "mps"

logging:
  use_wandb: false
  project: "contractive-latent-reasoning"
  entity: null
  log_interval: 50

optimization:
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 64
  epochs: 100
  grad_clip: 1.0

dynamics:
  latent_dim: 128
  t_span: [0.0, 5.0]
  solver: "dopri5" # "dopri5" (default adaptive), "rk4", "euler"
  step_size: 0.05
  rtol: 1.0e-5
  atol: 1.0e-5
  use_adjoint: true
  contraction_bound_kappa: 0.1
